{% extends 'base.html' %}
{% block title %}Delete Budget - ShilpoShop{% endblock %}

{% block content %}
<div class="confirm-box">
    <h2>Delete Budget Record</h2>
    <p>
        Are you sure you want to delete the budget record for
        <strong>{{ budget.month }}</strong>?
    </p>
    <form method="POST">
        {% csrf_token %}
        <div class="flex gap-1">
            <button type="submit" class="btn btn-red">Yes, Delete</button>
            <a href="{% url 'budget_list' %}" class="btn btn-gray">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
